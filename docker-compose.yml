services:

  backend:
    build: ./reposteria-backend
    container_name: backend_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./reposteria-backend/.env

  frontend:
    build: ./reposteria
    container_name: frontend_app
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend